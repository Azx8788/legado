name: Release Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RHINO_FORK_REPO: skybbk1001/htmlunit-rhino-fork
      CORE_JS_REPO: skybbk1001/htmlunit-core-js
    steps:
      - name: Set Version
        id: ver
        run: |
          echo "version=$(date -d "8 hour" -u +3.%y.%m%d%H)" >> $GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout htmlunit-rhino-fork
        uses: actions/checkout@v4
        with:
          repository: ${{ env.RHINO_FORK_REPO }}
          path: htmlunit-rhino-fork

      - name: Checkout htmlunit-core-js
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CORE_JS_REPO }}
          path: htmlunit-core-js

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          cache: maven

      - name: Install Forked htmlunit-core-js To mavenLocal
        working-directory: htmlunit-core-js
        run: |
          mvn -U clean install -Dmaven.test.skip=true -Dgpg.skip=true -Dmaven.javadoc.skip=true

      - name: Prepare Apk Signing
        run: |
          cp legado.keystore app/legado.keystore
          echo "" >> gradle.properties
          echo "RELEASE_STORE_FILE=./legado.keystore" >> gradle.properties
          echo "RELEASE_KEY_ALIAS=app" >> gradle.properties
          echo "RELEASE_STORE_PASSWORD=Azx8788mz870" >> gradle.properties
          echo "RELEASE_KEY_PASSWORD=Azx8788mz870" >> gradle.properties

      - name: Unify Version Name
        run: |
          sed "/def version/c def version = \"${{ steps.ver.outputs.version }}\"" $GITHUB_WORKSPACE/app/build.gradle -i

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build With Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleAppRelease --build-cache --parallel --daemon --warning-mode all

      - name: Organize the Files
        run: |
          mkdir -p ${{ github.workspace }}/apk/
          for file in `ls ${{ github.workspace }}/app/build/outputs/apk/*/*/*.apk`; do
            base=$(basename "$file" .apk)
            abi=$(echo "$base" | grep -oE 'arm64-v8a|armeabi-v7a|x86_64' || true)
            if [ -z "$abi" ]; then
              abi="universal"
            fi
            cp "$file" ${{ github.workspace }}/apk/legado_app_${{ steps.ver.outputs.version }}_${abi}.apk
          done
          ls -lh ${{ github.workspace }}/apk/

      - name: Write Version Metadata
        run: |
          # 与 app/build.gradle 的 versionCode 同式(20000 + rev-list 全量计数)
          version_code=$((20000 + $(git rev-list HEAD --count)))
          cat > ${{ github.workspace }}/apk/version.json <<EOF
          {"versionCode":${version_code},"versionName":"${{ steps.ver.outputs.version }}","channel":"release"}
          EOF
          cat ${{ github.workspace }}/apk/version.json

      - name: Upload App To Artifact
        uses: actions/upload-artifact@v4
        with:
          name: legado_app_${{ steps.ver.outputs.version }}
          path: ${{ github.workspace }}/apk/*.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: legado_app_${{ steps.ver.outputs.version }}
          tag_name: ${{ steps.ver.outputs.version }}
          body_path: ${{ github.workspace }}/CHANGELOG.md
          draft: false
          prerelease: false
          files: |
            ${{ github.workspace }}/apk/legado_app_*.apk
            ${{ github.workspace }}/apk/version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}